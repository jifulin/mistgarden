<script>
  // 背景图片配置（使用公开 CDN 图片，适配 GitHub Pages）
  const bgImages = {
    anime1: 'https://img1.baidu.com/it/u=3181643731,2177419498&fm=253&fmt=auto&app=120&f=JPEG?w=1920&h=1080',
    anime2: 'https://img2.baidu.com/it/u=3678945051,1617958670&fm=253&fmt=auto&app=120&f=JPEG?w=1920&h=1080',
    anime3: 'https://img1.baidu.com/it/u=3724099946,3129786278&fm=253&fmt=auto&app=120&f=JPEG?w=1920&h=1080'
  };
  let currentBg = 'anime1';
  
  function switchBg(type) {
    currentBg = type;
    document.getElementById('bgImage').style.backgroundImage = `url('${bgImages[type]}')`;
    document.querySelectorAll('.bg-switch button').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }
  
  // 实时时钟
  function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const date = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    document.getElementById('clock').textContent = time;
    document.getElementById('date').textContent = date;
  }
  updateClock();
  setInterval(updateClock, 1000);
  
  // 标签切换
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    event.target.classList.add('active');
  }
  
  // 初始化背景
  switchBg('anime1');
</script>
