<script>
  // 背景图片配置（使用API获取随机横图）
  const BG_API = 'https://api.lqay.cn/api/zxsjt/?cat=heng';
  // 手机端用竖图接口（1242×1815 这类竖构图）。注意：这个接口的跳转目标不带 CORS 头，
  // 只能当普通图片用（background-image / <img>），fetch 成 blob 会被浏览器拦掉
  const BG_API_MOBILE = 'https://img.paulzzh.com/touhou/random?size=wap';
  const NARROW_MQ = window.matchMedia('(max-width: 640px)');
  let currentBg = null;
  let nextBg = null;
  let bgInterval = null;
  const AUTO_INTERVAL = 6000; // 6秒
  const FIXED_BG = 'https://cdn.jsdmirror.com/gh/lqay-cn/cdn@main/img/zx/h/%E7%9C%9F%E5%AF%BB1184.png';

  // 背景图分两层交替显示，切换时旧图淡出、新图淡入（交叉淡入淡出，不会露出页面底色）
  const BG_LAYERS = [document.getElementById('bgImage'), document.getElementById('bgImage2')];
  let activeLayer = 0;          // 当前显示的是哪一层
  const FADE_MS = 900;          // 与 style.css 里 .bg-image 的 transition 保持一致

  // 拉一张随机图并等到解码完成，返回可用作背景的地址
  async function fetchBgBlob() {
    // 手机端：接口没有 CORS 头，走不了 fetch，直接把 URL 交给 background-image。
    // 带个随机参数，否则浏览器可能把 302 缓存住、一直返回同一张
    if (NARROW_MQ.matches) {
      const url = BG_API_MOBILE + '&r=' + Date.now() + Math.random().toString(36).slice(2, 6);
      await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve();
        img.onerror = reject;
        img.src = url;
      });
      return url;
    }
    const resp = await fetch(BG_API);
    const blob = await resp.blob();
    const imgUrl = URL.createObjectURL(blob);
    await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve();
      img.onerror = reject;
      img.src = imgUrl;
    });
    return imgUrl;
  }

  // 把 url 交叉淡入到前台；返回刚被换下去的那一层，调用方据此回收旧 blob
  function crossFade(url) {
    const cur = BG_LAYERS[activeLayer];
    const nxt = BG_LAYERS[1 - activeLayer];
    // 新图先放到隐藏层并锁死在透明状态，避免它带着上一张的过渡闪一下
    nxt.style.transition = 'none';
    nxt.style.opacity = '0';
    nxt.style.backgroundImage = `url('${url}')`;
    void nxt.offsetWidth;               // 强制重排，让上面的初始状态生效
    nxt.style.transition = '';          // 恢复 CSS 里的过渡
    requestAnimationFrame(() => {
      nxt.style.opacity = '1';
      cur.style.opacity = '0';
    });
    activeLayer = 1 - activeLayer;
    return cur;
  }

  // 预加载下一张背景图片
  async function preloadBg() {
    const toggle = document.getElementById('bgToggle');
    if (!toggle || !toggle.checked) return;
    if (nextBg) {
      URL.revokeObjectURL(nextBg);
      nextBg = null;
    }
    try {
      nextBg = await fetchBgBlob();
    } catch (e) {
      console.error('Failed to preload background image', e);
    }
  }

  async function switchBg() {
    try {
      // 使用预加载的图片，如果没有就立即加载
      let newBgUrl = nextBg;
      nextBg = null;
      if (!newBgUrl) newBgUrl = await fetchBgBlob();

      const oldBg = currentBg;
      currentBg = newBgUrl;
      crossFade(newBgUrl);

      // 旧图还在淡出，等过渡结束再回收，否则可能闪一下
      if (oldBg) setTimeout(() => URL.revokeObjectURL(oldBg), FADE_MS + 300);

      // 预加载下一张
      preloadBg();
    } catch (e) {
      console.error('Failed to load background image', e);
    }
  }

  // 关闭随机背景时切回固定图（同样走淡入淡出）
  function showFixedBg() {
    if (nextBg) { URL.revokeObjectURL(nextBg); nextBg = null; }
    const oldBg = currentBg;
    currentBg = null;
    crossFade(FIXED_BG);
    if (oldBg) setTimeout(() => URL.revokeObjectURL(oldBg), FADE_MS + 300);
  }

  // 自动切换背景
  function startBgAuto() {
    clearInterval(bgInterval);
    // 使用 setTimeout 递归，确保间隔固定，避免重叠
    function scheduleNext() {
      bgInterval = setTimeout(() => {
        switchBg().then(() => scheduleNext());
      }, AUTO_INTERVAL);
    }
    scheduleNext();
  }
  function stopBgAuto() {
    clearTimeout(bgInterval);
    bgInterval = null;
  }

  // 页面加载初始化
  (function() {
    const html = document.documentElement;
    const toggle = document.getElementById('bgToggle');

    // === 主题初始化：手动优先级 > 时间自动（会话级别）===
    const savedTheme = sessionStorage.getItem('theme');
    if (savedTheme === 'light') {
      html.setAttribute('data-theme', 'light');
      document.getElementById('themeBtn').textContent = '☀️';
    } else if (savedTheme === 'dark') {
      html.removeAttribute('data-theme');
      document.getElementById('themeBtn').textContent = '🌙';
    } else {
      // 无手动记录，按时间自动（6:00-18:00 白天）
      const hour = new Date().getHours();
      if (hour >= 6 && hour < 18) {
        html.setAttribute('data-theme', 'light');
        document.getElementById('themeBtn').textContent = '☀️';
      }
    }

    // === 背景自动切换初始化 ===
    const autoBg = sessionStorage.getItem('autoBg');
    if (autoBg === 'off') {
      toggle.checked = false;
      stopBgAuto();
      showFixedBg();
    } else {
      toggle.checked = true;
      // 先预加载，再切换
      preloadBg().then(() => switchBg());
      startBgAuto();
    }

    // === 主题切换事件 ===
    document.getElementById('themeBtn').addEventListener('click', function() {
      if (html.getAttribute('data-theme') === 'light') {
        html.removeAttribute('data-theme');
        this.textContent = '🌙';
        sessionStorage.setItem('theme', 'dark');
      } else {
        html.setAttribute('data-theme', 'light');
        this.textContent = '☀️';
        sessionStorage.setItem('theme', 'light');
      }
    });

    // === 背景开关切换事件 ===
    toggle.addEventListener('change', function() {
      if (this.checked) {
        switchBg();
        startBgAuto();
        sessionStorage.setItem('autoBg', 'on');
      } else {
        stopBgAuto();
        sessionStorage.setItem('autoBg', 'off');
        // 切回固定图（淡入淡出），并清理预加载，避免关闭后仍请求 API
        showFixedBg();
      }
    });
  })();

  // === 手机端底部布局：播放器收成左下角小按钮 + 底部控件组让位 ===
  // 播放器高度会随歌词/歌单展开而变化，所以用 ResizeObserver 实时贴在它上方
  // 注意：这段内联脚本在 .music-player（页面后半部分）之前执行，必须等 DOM 就绪
  function setupMobileBottomUI() {
    const mq = window.matchMedia('(max-width: 640px)');
    const player = document.querySelector('.music-player');
    const bar = document.querySelector('.fixed-bottom');
    const btn = document.getElementById('musicToggle');
    if (!player || !bar) return;

    const BTN      = 44;      // 按钮的布局尺寸（固定；贴边靠 transform 缩小，命中区不缩水）
    const DOCK_GAP = 2;       // 贴边后离屏幕边缘几像素
    const DOCK_IN  = 14;      // 离边 ≤14px 判定为贴边
    const DOCK_OUT = 28;      // 拉开 >28px 才脱离（滞回，免得在阈值上来回抖）
    const clamp = function (v, min, max) { return Math.min(Math.max(v, min), max); };
    let pos = null;                        // 按钮布局左上角（视口坐标）
    let dock = { x: null, y: null };        // 当前贴住哪几条边
    let open = true;
    let side = 'left';                     // 展开时播放器贴哪边，跟着按钮走
    let suppressClick = false;             // 刚拖完那一下不算点击
    let drag = null;

    /* --- 底部控件组：只在真被播放器压住时才抬起来；收起或桌面端用回 CSS 的 bottom: 20px --- */
    function sync() {
      if (!mq.matches || player.classList.contains('is-collapsed')) { bar.style.bottom = ''; return; }
      placePlayer();                               // 播放器跟着按钮走，位置每次现算
      bar.style.bottom = '';                       // 先归位再量，否则会拿上一次的抬高值自我反馈
      const p = player.getBoundingClientRect();
      const b = bar.getBoundingClientRect();
      if (p.left < b.right && b.left < p.right && p.top < b.bottom && b.top < p.bottom) {
        const lift = Math.round(window.innerHeight - p.top + 8);
        if (lift <= window.innerHeight - 8) bar.style.bottom = lift + 'px';   // 抬起来也得留在屏幕里
      }
    }
    /* --- 桌面端：手柄高度跟着播放器走（展开歌单/歌词变高时也保持一致） --- */
    function syncHandle() {
      if (!btn) return;
      if (mq.matches) { btn.style.height = ''; return; }     // 手机端是 44×44，交回 CSS
      const h = player.offsetHeight;
      if (h) btn.style.height = h + 'px';
    }

    if (window.ResizeObserver) new ResizeObserver(function () { sync(); syncHandle(); }).observe(player);
    window.addEventListener('resize', function () { clampBtn(); sync(); syncHandle(); });
    sync();
    syncHandle();
    // 播放器内容是异步出来的（歌单、歌词、字体），补校准几次
    [400, 1500, 3000].forEach(function (t) { setTimeout(function () { sync(); syncHandle(); }, t); });

    if (!btn) return;

    /* --- 展开/收回：手机默认收起，不挡页脚 --- */
    function apply(next) {
      open = next;
      player.classList.toggle('is-collapsed', !open);
      player.classList.toggle('is-right', side === 'right');
      btn.textContent = open ? (mq.matches ? '✕' : '«') : '🎵';   // 桌面端拉开时显示「收回」箭头
      btn.title = open ? '收起播放器' : '展开播放器';
      btn.setAttribute('aria-expanded', String(open));
      // 桌面端：手柄跟着抽屉一起被推出去（手机端手柄是独立的浮动按钮，不动）
      btn.classList.toggle('is-drawer-open', open && !mq.matches);
      if (open) placePlayer();
      sync();
      if (open) armIdle(); else keepOpen();
    }

    /* --- 桌面端抽屉：闲置（鼠标也不在上面）就自动收回贴边，点左边手柄再滑出 --- */
    const IDLE_MS = 8000;                  // 多久没操作就收回去
    let idleTimer = null;
    let hovering = false;
    function keepOpen() { clearTimeout(idleTimer); idleTimer = null; }
    function armIdle() {
      keepOpen();
      if (mq.matches || !open || hovering) return;   // 手机端不自动收；鼠标停在播放器上也不收
      idleTimer = setTimeout(function () { if (!mq.matches && !hovering && open) apply(false); }, IDLE_MS);
    }
    player.addEventListener('mouseenter', function () { hovering = true; keepOpen(); });
    player.addEventListener('mouseleave', function () { hovering = false; armIdle(); });
    player.addEventListener('mousemove', keepOpen);        // 动一下（拖进度条、翻歌单）就重新计时
    player.addEventListener('click', armIdle);
    btn.addEventListener('mouseenter', function () { if (!mq.matches) armIdle(); });

    player.classList.toggle('is-drawer', !mq.matches);     // 抽屉的收起样式只在桌面端生效
    apply(!mq.matches);                            // 桌面端先展开（随后闲置自动收回），手机端默认收起
    btn.addEventListener('click', function () {
      if (suppressClick) { suppressClick = false; return; }
      apply(!open);
    });

    /* --- 播放器跟着按钮走：放按钮下方，下方放不下就放上方，横向占满 --- */
    function placePlayer() {
      if (!mq.matches || !pos) return;
      const h = player.offsetHeight || 131;
      const gap = 6;
      player.style.left = '10px';
      player.style.right = '10px';
      player.style.bottom = 'auto';
      player.style.top = (pos.y + BTN + gap + h <= window.innerHeight - 8)
        ? Math.round(pos.y + BTN + gap) + 'px'                  // 按钮下面放得下
        : Math.round(Math.max(8, pos.y - gap - h)) + 'px';      // 否则放到按钮上面
    }
    function clearPlayerStyle() {
      player.style.left = player.style.right = player.style.top = player.style.bottom = '';
    }

    /* --- 按钮可拖动：手机上未必有“刚好不挡东西”的位置，让用户自己挪（位置记在 localStorage）--- */
    const POS_KEY = 'mistgarden-music-btn';

    function readPos() {
      try {
        const v = localStorage.getItem(POS_KEY);
        if (!v) return null;
        const a = v.split(',');
        const x = parseFloat(a[0]), y = parseFloat(a[1]);
        return isFinite(x) && isFinite(y) ? { x: x, y: y } : null;
      } catch (e) { return null; }
    }

    // 按 pos 写样式：靠边就吸到边上并缩小（滞回，免得在阈值上来回抖）
    function layoutButton(remember) {
      if (!mq.matches) return;
      const nearX = pos.x <= DOCK_IN ? 'left'
                  : pos.x + BTN >= window.innerWidth - DOCK_IN ? 'right' : null;
      const nearY = pos.y <= DOCK_IN ? 'top'
                  : pos.y + BTN >= window.innerHeight - DOCK_IN ? 'bottom' : null;
      if (dock.x === 'left'   && pos.x > DOCK_OUT) dock.x = null;
      if (dock.x === 'right'  && pos.x + BTN < window.innerWidth - DOCK_OUT) dock.x = null;
      if (dock.y === 'top'    && pos.y > DOCK_OUT) dock.y = null;
      if (dock.y === 'bottom' && pos.y + BTN < window.innerHeight - DOCK_OUT) dock.y = null;
      if (nearX) dock.x = nearX;
      if (nearY) dock.y = nearY;

      let x = pos.x, y = pos.y;
      if (dock.x === 'left')   x = DOCK_GAP;
      if (dock.x === 'right')  x = window.innerWidth - BTN - DOCK_GAP;
      if (dock.y === 'top')    y = DOCK_GAP;
      if (dock.y === 'bottom') y = window.innerHeight - BTN - DOCK_GAP;
      pos = { x: x, y: y };

      btn.style.left = Math.round(x) + 'px';
      btn.style.top = Math.round(y) + 'px';
      btn.style.bottom = 'auto';
      // 缩小的方向朝着贴着的那条边，看起来就是“缩到边上”
      btn.classList.toggle('is-docked', !!(dock.x || dock.y));
      btn.style.transformOrigin =
        (dock.x === 'right' ? 'right' : dock.x === 'left' ? 'left' : 'center') + ' ' +
        (dock.y === 'bottom' ? 'bottom' : dock.y === 'top' ? 'top' : 'center');

      side = (x + BTN / 2 > window.innerWidth / 2) ? 'right' : 'left';
      player.classList.toggle('is-right', side === 'right');
      if (open) placePlayer();
      if (remember) { try { localStorage.setItem(POS_KEY, Math.round(x) + ',' + Math.round(y)); } catch (e) {} }
    }

    function place(x, y, remember) {
      if (!mq.matches) return;
      pos = { x: clamp(x, 0, window.innerWidth - BTN), y: clamp(y, 0, window.innerHeight - BTN) };
      layoutButton(remember);
    }
    // 屏幕旋转/缩放后把按钮拉回可视区
    function clampBtn() {
      if (!mq.matches || !pos) return;
      place(pos.x, pos.y, true);
    }

    const saved = readPos();
    if (saved && mq.matches) place(saved.x, saved.y, false);

    btn.addEventListener('pointerdown', function (e) {
      if (!mq.matches || e.button > 0) return;
      // 必须拦默认行为：不拦的话浏览器会启动原生拖拽/选择，pointer 立刻被 cancel，拖动只跟一帧
      if (e.cancelable) e.preventDefault();
      if (!pos) { const r = btn.getBoundingClientRect(); pos = { x: r.left, y: r.top }; }
      drag = { id: e.pointerId, dx: e.clientX - pos.x, dy: e.clientY - pos.y,
               x0: e.clientX, y0: e.clientY, moved: false };
      if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId);
    });
    btn.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      // 移动不超过 6px 当点击，避免手抖就把按钮挪走
      if (!drag.moved && Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) < 6) return;
      drag.moved = true;
      btn.classList.add('is-dragging');
      place(e.clientX - drag.dx, e.clientY - drag.dy, false);
    });
    function endDrag(e, cancelled) {
      if (!drag || (e && e.pointerId !== drag.id)) return;
      const moved = drag.moved;
      drag = null;
      btn.classList.remove('is-dragging');
      if (moved) layoutButton(true);                       // 松手再存一次位置（贴边后的最终位置）
      // 没拖动就是点了一下 = 开关。不用等 click：pointerdown 拦了默认行为后 click 不一定派发
      if (!moved && !cancelled) apply(!open);
      suppressClick = true;                                // 真来了 click 也别再切一次
      setTimeout(function () { suppressClick = false; }, 350);
    }
    btn.addEventListener('pointerup', function (e) { endDrag(e, false); });
    btn.addEventListener('pointercancel', function (e) { endDrag(e, true); });

    // 在询问框里选了「播放」= 现在就想听，顺手把播放器展开
    const yes = document.getElementById('playAskYes');
    if (yes) yes.addEventListener('click', function () { if (mq.matches) apply(true); });

    // 窗口从桌面缩到手机宽度（或反过来）时，跟着切到对应的默认状态
    function onMq() {
      if (!mq.matches) clearPlayerStyle();      // 回桌面端：位置交回 CSS，别留内联样式
      player.classList.toggle('is-drawer', !mq.matches);
      apply(!mq.matches);
      syncHandle();
      armIdle();
    }
    if (mq.addEventListener) mq.addEventListener('change', onMq);
    else if (mq.addListener) mq.addListener(onMq);

    // 收起状态下音乐还在放：按钮呼吸提示（APlayer 的 audio 元素是异步建出来的，找不到就重试）
    (function watchAudio(tries) {
      const au = player.querySelector('audio');
      if (!au) { if (tries < 25) setTimeout(function () { watchAudio(tries + 1); }, 400); return; }
      const mark = function () { btn.classList.toggle('is-playing', !au.paused); };
      ['play', 'pause', 'ended'].forEach(function (e) { au.addEventListener(e, mark); });
      mark();
    })(0);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setupMobileBottomUI);
  else setupMobileBottomUI();

  // === 页面运行时功能 ===
  function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const date = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    document.getElementById('clock').textContent = time;
    document.getElementById('date').textContent = date;
  }
  updateClock();
  setInterval(updateClock, 1000);
  
  // 标签切换
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    event.target.classList.add('active');
  }
  
  // 一言
  async function fetchHitokoto() {
    try {
      const resp = await fetch('https://v1.hitokoto.cn');
      const data = await resp.json();
      const el = document.getElementById('hitokoto');
      el.textContent = data.hitokoto;
      if (data.from) el.title = `——《${data.from}》`;
      // 白天模式一言两种可读配色
      if (document.documentElement.getAttribute('data-theme') === 'light') {
        if (Math.random() < 0.5) {
          el.classList.add('hitokoto-alt');
        } else {
          el.classList.remove('hitokoto-alt');
        }
      }
    } catch (e) {
      document.getElementById('hitokoto').textContent = '点击获取一句话';
    }
  }
  fetchHitokoto();

  // 运行时间计数器
  const startTime = new Date('2026-09-20T06:00:00+08:00');
  function updateUptime() {
    const now = new Date();
    const diff = now - startTime;
    if (diff < 0) {
      document.getElementById('uptime').textContent = '网站运行中';
      return;
    }
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    const el = document.getElementById('uptime');
    el.textContent = `网站已运行 ${days}天 ${String(hours).padStart(2,'0')}时 ${String(mins).padStart(2,'0')}分 ${String(secs).padStart(2,'0')}秒`;
  }
  updateUptime();
  setInterval(updateUptime, 1000);

  // === 特效系统 ===
  const EFFECTS = ['sakura','particles','off'];
  let currentEffect = 'sakura'; // 强制默认樱花，可用 sessionStorage.getItem('effect') 恢复
  // let currentEffect = sessionStorage.getItem('effect') || 'sakura';
  const effectBtn = document.getElementById('effectBtn');
  function updateEffectBtn(){
    if(!effectBtn) return;
    const map = {sakura:'樱花', particles:'粒子', off:'关闭'};
    effectBtn.textContent = map[currentEffect] || '樱花';
  }
  // 国家公祭日：12月13日全站灰色
  (function checkMourning(){
    const now = new Date();
    if(now.getMonth()===11 && now.getDate()===13){
      document.documentElement.classList.add('mourning');
    }
  })();
  function destroyAllEffects(){
    const sakura = document.getElementById('sakura-container');
    if(sakura) sakura.remove();
    const canvas = document.getElementById('particles-canvas');
    if(canvas) canvas.remove();
    if(window.particleRAF) cancelAnimationFrame(window.particleRAF);
    if(window.sakuraInterval) clearInterval(window.sakuraInterval);
  }
  function initSakura(){
    // destroyAllEffects(); // 由外部统一清理
    const container = document.getElementById('sakura-container') || (()=>{ const c=document.createElement('div'); c.id='sakura-container'; document.body.appendChild(c); return c; })();
    if(!document.getElementById('sakura-container')) document.body.appendChild(container);
    const sakuraContainer = document.getElementById('sakura-container');
    function createPetal(){
      const p = document.createElement('div');
      p.className = 'sakura-petal';
      p.style.left = Math.random()*100 + 'vw';
      p.style.animationDuration = (8 + Math.random()*7) + 's';
      p.style.width = (14 + Math.random()*12) + 'px';
      p.style.height = (18 + Math.random()*10) + 'px';
      p.style.opacity = 0.6 + Math.random()*0.4;
      p.style.setProperty('--drift', Math.floor(Math.random()*200 - 100));
      p.style.transform = `rotate(${Math.random()*360}deg)`;
      container.appendChild(p);
      setTimeout(()=>p.remove(), 16000);
    }
    for(let i=0;i<30;i++) createPetal();
    window.sakuraInterval = setInterval(createPetal, 300);
  }
  function initParticles(){
    // destroyAllEffects(); // 由外部统一清理
    let canvas = document.getElementById('particles-canvas');
    if(!canvas){ canvas = document.createElement('canvas'); canvas.id='particles-canvas'; document.body.appendChild(canvas); }
    const ctx = canvas.getContext('2d');
    let w, h, particles = [];
    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    for(let i=0;i<120;i++){
      particles.push({
        x: Math.random()*w,
        y: Math.random()*h,
        vx: (Math.random()-0.5)*0.6,
        vy: (Math.random()-0.5)*0.6,
        r: 1 + Math.random()*2
      });
    }
    function draw(){
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      for(const p of particles){
        p.x += p.vx; p.y += p.vy;
        if(p.x<0||p.x>w) p.vx*=-1;
        if(p.y<0||p.y>h) p.vy*=-1;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
      }
      window.particleRAF = requestAnimationFrame(draw);
    }
    draw();
  }
  function applyEffect(effect){
    destroyAllEffects();
    // 共存模式：樱花 + 粒子同时存在
    initSakura();
    initParticles();
    currentEffect = effect;
    sessionStorage.setItem('effect', effect);
    updateEffectBtn();
  }
  // 默认启动特效，不依赖按钮存在
  updateEffectBtn();
  applyEffect(currentEffect);
  if(effectBtn){
    effectBtn.addEventListener('click', ()=>{
      const idx = EFFECTS.indexOf(currentEffect);
      const next = EFFECTS[(idx+1)%EFFECTS.length];
      applyEffect(next);
    });
  }
</script>
